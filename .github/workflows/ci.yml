name: CI
on: [push, pull_request]
jobs:
  test:
    # Three runners so the native hardware-id probes (registry MachineGuid,
    # IOPlatformUUID, /etc/machine-id) are exercised for real, not mocked.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release
